name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP: blocks
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

# actions pinned to commit SHAs; no build cache, so release builds start clean
jobs:
  linux:
    # older glibc so the AppImage runs on more distros
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: stable

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev desktop-file-utils

    - name: Version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Build
      run: cargo build --release --locked

    - name: Package tarball
      run: |
        dir="$APP-$VERSION-linux-x86_64"
        mkdir -p "dist/$dir"
        cp "target/release/$APP" "dist/$dir/"
        cp -r resources README.md LICENSE "dist/$dir/"
        tar -C dist -czf "dist/$dir.tar.gz" "$dir"

    - name: Package AppImage
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
        ARCH: x86_64
      run: |
        tools="$RUNNER_TEMP/appimage"
        mkdir -p "$tools"
        curl -fsSL -o "$tools/appimagetool" "$APPIMAGETOOL_URL"
        curl -fsSL -o "$tools/runtime" "$APPIMAGE_RUNTIME_URL"
        echo "$APPIMAGETOOL_SHA256  $tools/appimagetool" | sha256sum -c -
        echo "$APPIMAGE_RUNTIME_SHA256  $tools/runtime" | sha256sum -c -
        chmod +x "$tools/appimagetool"

        appdir=dist/AppDir
        mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
        cp "target/release/$APP" "$appdir/usr/bin/"
        cp -r resources "$appdir/usr/bin/"
        cp packaging/blocks.desktop "$appdir/usr/share/applications/"
        cp packaging/blocks.desktop "$appdir/"
        cp packaging/blocks.png "$appdir/usr/share/icons/hicolor/256x256/apps/"
        cp packaging/blocks.png "$appdir/"
        ln -s "usr/bin/$APP" "$appdir/AppRun"
        "$tools/appimagetool" --runtime-file "$tools/runtime" "$appdir" "dist/$APP-$VERSION-linux-x86_64.AppImage"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux
        path: |
          dist/*.tar.gz
          dist/*.AppImage
        if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: stable

    - name: Version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Build
      run: cargo build --release --locked

    - name: Package zip
      run: |
        dir="$APP-$VERSION-windows-x86_64"
        mkdir -p "dist/$dir"
        cp "target/release/$APP.exe" "dist/$dir/"
        cp -r resources README.md LICENSE "dist/$dir/"
        cd dist && 7z a -tzip "$dir.zip" "$dir"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows
        path: dist/*.zip
        if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: stable
        targets: aarch64-apple-darwin, x86_64-apple-darwin

    - name: Version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Build universal binary
      run: |
        export MACOSX_DEPLOYMENT_TARGET=11.0
        cargo build --release --locked --target aarch64-apple-darwin
        cargo build --release --locked --target x86_64-apple-darwin
        mkdir -p dist
        lipo -create -output "dist/$APP" \
          "target/aarch64-apple-darwin/release/$APP" \
          "target/x86_64-apple-darwin/release/$APP"

    - name: Package app bundle
      run: |
        app="dist/Blocks.app"
        mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
        mv "dist/$APP" "$app/Contents/MacOS/"
        cp -r resources/ "$app/Contents/Resources/"
        sed "s|@VERSION@|$VERSION|g" packaging/Info.plist > "$app/Contents/Info.plist"

        iconset=dist/blocks.iconset
        mkdir -p "$iconset"
        for s in 16 32 128 256 512; do
          sips -z $s $s packaging/blocks.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
          sips -z $((s*2)) $((s*2)) packaging/blocks.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
        done
        iconutil -c icns "$iconset" -o "$app/Contents/Resources/blocks.icns"
        rm -r "$iconset"

        # ad-hoc signature; required to launch on Apple silicon
        codesign --force --deep --sign - "$app"

    - name: Package dmg
      run: |
        staging=dist/dmg
        mkdir -p "$staging"
        mv dist/Blocks.app "$staging/"
        ln -s /Applications "$staging/Applications"
        hdiutil create -volname Blocks -srcfolder "$staging" -ov -format UDZO \
          "dist/$APP-$VERSION-macos-universal.dmg"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos
        path: dist/*.dmg
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true

    - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: dist/*
        generate_release_notes: true
        fail_on_unmatched_files: true
